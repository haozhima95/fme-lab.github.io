{% assign translations = site.pages | where: "ref", page.ref %}
<span class="language-switch" aria-label="Language">
  {% for item in translations %}
    {% if item.lang != page.lang %}
      <a href="{{ item.url | relative_url }}">{% if item.lang == 'zh' %}中文{% else %}English{% endif %}</a>
    {% endif %}
  {% endfor %}
</span>
